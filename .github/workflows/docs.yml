name: Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.readthedocs.yaml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/docs.yml'
      - '.github/workflows/actions.lock'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.readthedocs.yaml'
      - 'mise.toml'
      - 'mise.lock'
      - '.github/workflows/docs.yml'
      - '.github/workflows/actions.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run docs:build
