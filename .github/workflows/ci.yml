name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.pyi'
      - 'tests/fonts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mise.toml'
      - 'mise.lock'
      - 'rust-toolchain.toml'
      - '.python-version'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '**/*.rs'
      - '**/*.py'
      - '**/*.pyi'
      - 'tests/fonts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'mise.toml'
      - 'mise.lock'
      - 'rust-toolchain.toml'
      - '.python-version'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: "true"
      - run: uv run --locked --only-group lint ruff format --check
      - run: uv run --locked --only-group lint ruff check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo check --locked --all-targets --all-features

  test:
    name: Test
    runs-on: ${{ matrix.runner }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: latest
            runner: ubuntu-latest
          - environment: minimum
            runner: ubuntu-latest
            python-version: "3.10"
            torch-version: "2.5.*"
            torchvision-version: "0.20.*"
          - environment: windows
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install skia-safe native dependencies
        if: runner.os == 'Linux'
        run: sudo sh .github/scripts/install-linux-deps.sh host
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: "true"
      - run: cargo test --locked --all-targets --all-features
      - if: matrix.environment == 'latest'
        run: uv run --locked ty check
      - if: matrix.environment != 'minimum'
        run: uv run --locked pytest tests
      - if: matrix.environment == 'minimum'
        run: >-
          uv run
          --isolated
          --locked
          --python ${{ matrix.python-version }}
          --index https://download.pytorch.org/whl/cpu
          --with "torch==${{ matrix.torch-version }}"
          --with "torchvision==${{ matrix.torchvision-version }}"
          pytest tests

  linux:
    runs-on: ${{ matrix.platform.runner }}
    needs: check
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist
          before-script-linux: . .github/scripts/install-linux-deps.sh ${{ matrix.platform.target }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --locked --release --out dist -i python3.14t
          before-script-linux: . .github/scripts/install-linux-deps.sh ${{ matrix.platform.target }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --locked --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
          architecture: x64
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --locked --release --out dist -i python3.14t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: dist

  macos:
    runs-on: macos-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --locked --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14t"
      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@v1
        with:
          target: aarch64
          args: --locked --release --out dist -i python3.14t
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-aarch64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: [test, linux, windows, macos, sdist]
    environment: pypi
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Install uv
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish --trusted-publishing always 'wheels-*/*'
