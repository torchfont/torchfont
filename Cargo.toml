[package]
name = "torchfont"
version = "0.13.11"
edition = "2024"
description = "Datasets, Transforms and Models specific to Vector Fonts"
license = "MIT"
repository = "https://github.com/torchfont/torchfont"

[lib]
name = "_torchfont"
crate-type = ["cdylib"]

[dependencies]
ignore = "0.4.33"
kurbo = "0.13.1"
memmap2 = "0.9.12"
numpy = "0.30.0"
petgraph = { version = "0.8.3", default-features = false }
rayon = "1.12.0"
shellexpand = "3.1.2"
smallvec = "1.16.4"
skia-safe = "0.153.3"
skrifa = "0.49.0"
google-fonts-glyphsets = "1.1.3"

[dependencies.pyo3]
version = "0.30.1"
features = ["abi3-py310"]
